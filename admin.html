<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Portfólio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #111827;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 { margin-top: 0; color: #8b5cf6; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
        input[type="text"], textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { resize: vertical; height: 100px; }
        button {
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #7c3aed; }
        .project-list { margin-top: 2rem; border-top: 2px solid #e5e7eb; padding-top: 2rem; }
        .project-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 1rem;
            border: 1px solid #e5e7eb;
        }
        .delete-btn {
            background-color: #ef4444;
        }
        .delete-btn:hover { background-color: #dc2626; }
        .nav-back {
            display: inline-block;
            margin-bottom: 1rem;
            color: #4b5563;
            text-decoration: none;
        }
        .nav-back:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="nav-back">← Voltar ao Portfólio</a>
        <h1>Adicionar Novo Projeto</h1>
        <form id="projectForm">
            <div class="form-group">
                <label>Título do Projeto</label>
                <input type="text" id="pTitle" placeholder="Ex: Plataforma E-commerce" required>
            </div>
            <div class="form-group">
                <label>Subtítulo / Tag</label>
                <input type="text" id="pSubtitle" placeholder="Ex: Solução Web" required>
            </div>
            <div class="form-group">
                <label>Descrição Curta</label>
                <textarea id="pDesc" placeholder="Descreva o projeto brevemente..." required></textarea>
            </div>
            <div class="form-group">
                <label>Métrica 1 (Ex: 100%)</label>
                <input type="text" id="pStat1Value" placeholder="Valor (Ex: 100%)">
                <input type="text" id="pStat1Label" placeholder="Rótulo (Ex: Responsivo)" style="margin-top: 0.5rem;">
            </div>
            <button type="submit">Guardar Projeto</button>
        </form>

        <div class="project-list">
            <h2>Projetos Salvos Localmente</h2>
            <div id="projectsContainer"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('projectForm');
        const container = document.getElementById('projectsContainer');

        function loadProjects() {
            const projects = JSON.parse(localStorage.getItem('custom_projects') || '[]');
            container.innerHTML = '';
            
            if (projects.length === 0) {
                container.innerHTML = '<p style="color: #6b7280;">Nenhum projeto adicionado ainda.</p>';
                return;
            }

            projects.forEach((p, index) => {
                const div = document.createElement('div');
                div.className = 'project-item';
                div.innerHTML = `
                    <div>
                        <strong style="display:block;font-size:1.1rem;">${p.title}</strong>
                        <span style="color:#6b7280;font-size:0.9rem;">${p.subtitle}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteProject(${index})">Eliminar</button>
                `;
                container.appendChild(div);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const project = {
                id: Date.now().toString(),
                title: document.getElementById('pTitle').value,
                subtitle: document.getElementById('pSubtitle').value,
                desc: document.getElementById('pDesc').value,
                stat1Value: document.getElementById('pStat1Value').value,
                stat1Label: document.getElementById('pStat1Label').value,
            };

            const projects = JSON.parse(localStorage.getItem('custom_projects') || '[]');
            projects.push(project);
            localStorage.setItem('custom_projects', JSON.stringify(projects));
            
            form.reset();
            loadProjects();
            alert('Projeto adicionado com sucesso! Volte ao portfólio para ver.');
        });

        window.deleteProject = function(index) {
            if(confirm('Tem a certeza que quer eliminar este projeto?')) {
                const projects = JSON.parse(localStorage.getItem('custom_projects') || '[]');
                projects.splice(index, 1);
                localStorage.setItem('custom_projects', JSON.stringify(projects));
                loadProjects();
            }
        }

        loadProjects();
    </script>
</body>
</html>
